[project]
name = "killhouse"
version = "0.1.0"
description = "CQB/Killhouse simulation prototype: procedural building, 4-operator team, replay viewer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
killhouse = "killhouse.cli:main"
killhouse-bench = "killhouse.bench:main"
killhouse-sens = "killhouse.sensitivity:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/killhouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
