[project]
name = "killhouse"
version = "0.1.0"
description = "CQB/Killhouse simulation prototype: procedural building, 4-operator team, replay viewer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
killhouse = "killhouse.cli:main"
killhouse-bench = "killhouse.bench:main"
killhouse-sens = "killhouse.sensitivity:main"
killhouse-3d = "killhouse.viewer3d:main"
killhouse-apartment = "killhouse.clearing:main"
killhouse-tactics = "killhouse.tactics:main"
killhouse-analyze = "killhouse.analysis:main"
killhouse-prefreeze = "killhouse.prefreeze:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/killhouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
gpu = ["torch>=2.6"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
